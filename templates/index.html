<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker | AVIP 2026</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#0d1117; color:#e6edf3; display:flex; justify-content:center; padding:40px 16px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; width:100%; max-width:480px; }
  h1 { font-size:1.3rem; margin-top:0; }
  input[type=text] { width:100%; padding:10px; border-radius:6px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; font-size:1rem; box-sizing:border-box; }
  button { margin-top:12px; padding:10px 18px; border:none; border-radius:6px; background:#238636; color:white; font-weight:600; cursor:pointer; width:100%; }
  button:hover { background:#2ea043; }
  .score-Weak { color:#f85149; }
  .score-Moderate { color:#d29922; }
  .score-Strong { color:#3fb950; }
  .result { margin-top:20px; padding:16px; background:#0d1117; border-radius:8px; border:1px solid #30363d; }
  ul { padding-left:18px; font-size:0.9rem; color:#8b949e; }
  footer { margin-top:24px; font-size:0.8rem; color:#6e7681; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 Password Strength Checker</h1>
    <form method="POST" autocomplete="off">
      <input type="text" name="password" placeholder="Enter a password to test" value="{{ result.password if result else '' }}">
      <button type="submit">Check Strength</button>
    </form>

    {% if result %}
    <div class="result">
      <p><strong>Category:</strong> <span class="score-{{ result.category }}">{{ result.category }}</span></p>
      <p><strong>Score:</strong> {{ result.score }}</p>
      <p><strong>Rationale:</strong></p>
      <ul>
        {% for reason in result.reasons %}
          <li>{{ reason }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <footer>AVIP 2026 · CyberSecurity Task 2 · B.Y.T.E by Arithmatrix</footer>
  </div>
</body>
</html>
